name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking)
        # 36 pre-existing errors (no-explicit-any, react-refresh exports,
        # unused vars). Flip to blocking when the ROADMAP Tier 2
        # "Lint/format/a11y" burn-down lands.
        continue-on-error: true
        run: npm run lint

      - name: Typecheck + build
        # "build" runs `tsc -b && vite build` — covers the typecheck gate
        run: npm run build

      - name: Unit tests
        run: npm run test

  backend:
    name: Backend (import smoke)
    # No pytest suite exists yet (ROADMAP Tier 1); until it lands, importing
    # the app catches syntax/import/dependency-resolution breakage cheaply.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import smoke test
        env:
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
          DATABASE_PATH: ./ci-smoke.db
        run: python -c "from app.main import app; print('app imported OK:', app.title)"
