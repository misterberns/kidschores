name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Two ordering traps here, both of which fail SILENTLY GREEN:
      #
      # 1. This must be its OWN step, BEFORE the install it protects. setup-ci
      #    appends its shim dir to GITHUB_PATH, which only takes effect in
      #    *later* steps. Run after `npm ci` and it intercepts nothing.
      # 2. safe-chain must be installed GLOBALLY, not invoked via `npx`. The
      #    generated shims test `command -v safe-chain` and fall through to the
      #    unprotected command when it is missing. `npx` runs it from a temp
      #    cache that is gone by the next step, so every shim printed
      #    "safe-chain is not available to protect you" while the job stayed
      #    green. Verify by asserting that warning is ABSENT from the install log.
      - name: Safe Chain (malicious-package interception)
        working-directory: .
        run: |
          npm install -g @aikidosec/safe-chain
          safe-chain setup-ci

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking)
        # 36 pre-existing errors (no-explicit-any, react-refresh exports,
        # unused vars). Flip to blocking when the ROADMAP Tier 2
        # "Lint/format/a11y" burn-down lands.
        continue-on-error: true
        run: npm run lint

      - name: Typecheck + build
        # "build" runs `tsc -b && vite build` — covers the typecheck gate
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: npm audit (non-blocking report)
        continue-on-error: true
        run: npm audit --audit-level=high

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Version-surface consistency (docs/RELEASE.md section 1)
        working-directory: .
        run: bash scripts/check-version-consistency.sh

      # Same ordering rule as the frontend job — before the install, own step.
      # Node is preinstalled on ubuntu-latest, so npx works without setup-node.
      # safe-chain shims pip/python as well as npm.
      - name: Safe Chain (malicious-package interception)
        working-directory: .
        run: |
          npm install -g @aikidosec/safe-chain
          safe-chain setup-ci

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        # conftest.py provides the ephemeral DB + JWT secret itself
        run: python -m pytest tests/ -q

      - name: pip-audit (non-blocking report)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  e2e:
    name: E2E (Playwright vs ephemeral stack)
    # Full-stack validation: the real nginx+uvicorn compose stack (the same
    # shape as production), exercised by the ~220-test api+chromium suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        env:
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
          ENVIRONMENT: test
          UI_PORT: '3103'
        run: |
          mkdir -p data && chmod 777 data  # backend runs as UID 999
          docker compose up -d --build

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Safe Chain (malicious-package interception)
        run: |
          npm install -g @aikidosec/safe-chain
          safe-chain setup-ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for the stack
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:3103/api/health >/dev/null; do sleep 3; done'
          curl -s http://localhost:3103/api/health

      - name: Run e2e suite
        working-directory: e2e
        env:
          API_URL: http://localhost:3103
          FRONTEND_URL: http://localhost:3103
          CI: 'true'
        run: npx playwright test --project api --project chromium

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --tail 200

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  security:
    name: Security (Aikido — blocking on high+)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # for post-scan-status-comment
    env:
      AIKIDO_SECRET_KEY: ${{ secrets.AIKIDO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      # The `secrets` context cannot be used in a job-level `if`, so gate on an
      # env copy instead. This makes the job self-activating: it is inert until
      # AIKIDO_SECRET_KEY exists, and becomes a real blocking gate the moment it
      # does — no follow-up edit to this file required.
      - name: Is the Aikido gate configured?
        id: gate
        run: |
          if [ -z "$AIKIDO_SECRET_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Aikido gate INACTIVE::AIKIDO_SECRET_KEY is not set, so no dependency/SAST scan ran for this PR. Add the repo secret to activate the blocking high+ gate."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Blocking on HIGH and CRITICAL. Medium/low stay non-blocking and are
      # reported by the existing `npm audit` / `pip-audit` steps above.
      # NOTE: minimum-severity defaults to CRITICAL — HIGH must be set explicitly.
      - name: Aikido scan
        if: steps.gate.outputs.configured == 'true'
        uses: AikidoSec/github-actions-workflow@v1.0.13
        with:
          secret-key: ${{ secrets.AIKIDO_SECRET_KEY }}
          minimum-severity: HIGH
          fail-on-dependency-scan: true
          fail-on-sast-scan: true
          fail-on-iac-scan: false
          post-scan-status-comment: only_if_new_findings
          github-token: ${{ secrets.GITHUB_TOKEN }}
