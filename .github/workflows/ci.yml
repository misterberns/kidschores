name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking)
        # 36 pre-existing errors (no-explicit-any, react-refresh exports,
        # unused vars). Flip to blocking when the ROADMAP Tier 2
        # "Lint/format/a11y" burn-down lands.
        continue-on-error: true
        run: npm run lint

      - name: Typecheck + build
        # "build" runs `tsc -b && vite build` — covers the typecheck gate
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: npm audit (non-blocking report)
        continue-on-error: true
        run: npm audit --audit-level=high

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Version-surface consistency (docs/RELEASE.md section 1)
        working-directory: .
        run: bash scripts/check-version-consistency.sh

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        # conftest.py provides the ephemeral DB + JWT secret itself
        run: python -m pytest tests/ -q

      - name: pip-audit (non-blocking report)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  e2e:
    name: E2E (Playwright vs ephemeral stack)
    # Full-stack validation: the real nginx+uvicorn compose stack (the same
    # shape as production), exercised by the ~220-test api+chromium suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        env:
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
          ENVIRONMENT: test
          UI_PORT: '3103'
        run: |
          mkdir -p data && chmod 777 data  # backend runs as UID 999
          docker compose up -d --build

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for the stack
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:3103/api/health >/dev/null; do sleep 3; done'
          curl -s http://localhost:3103/api/health

      - name: Run e2e suite
        working-directory: e2e
        env:
          API_URL: http://localhost:3103
          FRONTEND_URL: http://localhost:3103
          CI: 'true'
        run: npx playwright test --project api --project chromium

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --tail 200

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
