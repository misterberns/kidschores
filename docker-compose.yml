services:
  frontend:
    build: ./frontend
    container_name: kidschores-ui
    ports:
      - "${UI_PORT:-3103}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      # Use 127.0.0.1 (IPv4) — nginx listens on IPv4 only (`listen 80;`), so `localhost`
      # can resolve to IPv6 [::1] and false-fail, which makes Traefik's Docker provider
      # drop the router (→ 404) even though the app serves fine.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./backend
    container_name: kidschores
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    environment:
      - DATABASE_PATH=/app/data/kidschores.db
      # Defaults to production so the destructive /api/test/* endpoints stay unmounted.
      # Override with ENVIRONMENT=development only for local/e2e instances.
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3103}
      - TZ=${TZ:-America/Chicago}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-KidsChores}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
